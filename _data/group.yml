    institution: "University of New Mexico"
    years: "2014"
    end: 2014
    thesis: "GPU Implementations of Hermite Methods"
    now: "Researcher in the Computer Science Department at the University of New Mexico"

  - name: "Xi Chen"
    role: "PhD"
    institution: "University of New Mexico"
